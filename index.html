<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#7c3aed" />

    <!-- Primary meta -->
    <title>FitvoryaAI — AI-Powered Fitness Tracker</title>
    <meta name="description" content="Track workouts, nutrition, weight, and body measurements with FitvoryaAI. Personalized calorie targets, macro goals, streaks, badges, and progress charts — all in one place." />
    <meta name="keywords" content="fitness tracker, workout log, calorie counter, nutrition tracking, weight loss, macro tracker, India fitness app" />
    <meta name="author" content="FitvoryaAI" />
    <meta name="robots" content="index, follow" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- PWA manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Open Graph (Facebook, WhatsApp, LinkedIn) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://fitvoryaai.web.app/" />
    <meta property="og:title" content="FitvoryaAI — AI-Powered Fitness Tracker" />
    <meta property="og:description" content="Track workouts, nutrition, weight, and body measurements. Personalized calorie targets, macro goals, streaks, and progress charts." />
    <meta property="og:image" content="https://fitvoryaai.web.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:site_name" content="FitvoryaAI" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://fitvoryaai.web.app/" />
    <meta name="twitter:title" content="FitvoryaAI — AI-Powered Fitness Tracker" />
    <meta name="twitter:description" content="Track workouts, nutrition, weight, and body measurements. Personalized calorie targets, macro goals, streaks, and progress charts." />
    <meta name="twitter:image" content="https://fitvoryaai.web.app/og-image.png" />

    <!-- Canonical -->
    <link rel="canonical" href="https://fitvoryaai.web.app/" />

    <!-- Structured data — SoftwareApplication -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "FitvoryaAI",
      "applicationCategory": "HealthApplication",
      "operatingSystem": "Web",
      "url": "https://fitvoryaai.web.app/",
      "description": "AI-powered fitness tracker for workouts, nutrition, weight, and progress.",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      }
    }
    </script>

    <!-- Fonts — self-controlled display=swap to avoid FOIT -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
